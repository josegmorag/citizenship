<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>US Citizenship Interview Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="app">
      <!-- Welcome Screen -->
      <div id="welcome-screen" class="screen active">
        <div class="glass-panel">
          <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-landmark"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>
          </div>
          <h1>Citizenship Interview</h1>
          <p class="subtitle">Practice for your naturalization test</p>
          
          <div id="stats-panel" class="stats-panel hidden">
            <h4>Your Progress</h4>
            <div class="stats-grid">
              <div class="stat-box">
                <span class="stat-value" id="stat-attempts">0</span>
                <span class="stat-label">Attempts</span>
              </div>
              <div class="stat-box">
                <span class="stat-value" id="stat-passed">0</span>
                <span class="stat-label">Passed</span>
              </div>
            </div>
          </div>
          
          <div class="options">
            <button class="btn primary" id="btn-100">
              <span class="btn-title">100 Questions Test</span>
              <span class="btn-desc">(2008 Version)</span>
            </button>
            <button class="btn secondary" id="btn-128">
              <span class="btn-title">128 Questions Test</span>
              <span class="btn-desc">(2025 Version)</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Interview Screen -->
      <div id="interview-screen" class="screen">
        <header>
          <button id="btn-exit" class="btn-icon" title="Exit Interview">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
          <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="score" style="display: flex; gap: 0.75rem; align-items: center;">
            <span style="color: var(--success); font-weight: bold;">✔ <span id="score-correct">0</span></span>
            <span>|</span>
            <span style="color: var(--danger); font-weight: bold;">✖ <span id="score-incorrect">0</span></span>
            <span>|</span>
            <span>Total: <span id="total-val">10</span></span>
          </div>
        </header>

        <main class="interview-content">
          <div class="character-container" id="character">
            <!-- AI Officer Avatar -->
            <img class="avatar" src="/officer.png" alt="USCIS Officer" />
            <div class="speech-bubble" id="question-text">
              <span class="typing-indicator">
                <span></span><span></span><span></span>
              </span>
            </div>
          </div>

          <div class="interaction-area">
            <div id="feedback-panel" class="feedback hidden">
              <div class="feedback-icon"></div>
              <div class="feedback-text">
                <h3 id="feedback-title">Correct!</h3>
                <p id="feedback-user-answer" style="margin-bottom: 0.5rem; font-style: italic; color: var(--text-main);"></p>
                <p id="feedback-detail">The correct answer was: George Washington</p>
              </div>
            </div>

            <div class="input-container" id="input-container">
              <button id="btn-mic" class="btn-mic">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
              </button>
              <div class="text-fallback">
                <input type="text" id="text-answer" placeholder="Or type your answer here..." autocomplete="off"/>
                <button id="btn-submit" class="btn primary small">Submit</button>
              </div>
            </div>

            <div class="actions-container hidden" id="next-container">
              <button id="btn-next" class="btn primary full-width">Next Question</button>
            </div>
          </div>
        </main>
      </div>

      <!-- Results Screen -->
      <div id="results-screen" class="screen">
        <div class="glass-panel text-center results-panel">
          <h2>Interview Complete</h2>
          <div class="final-score" id="final-score">8/10</div>
          <p id="final-message">Great job! You passed the civics test simulation.</p>
          
          <div class="review-section">
            <h3>Question Review</h3>
            <div id="review-list" class="review-list">
              <!-- Dynamically populated review items will go here -->
            </div>
          </div>

          <button id="btn-restart" class="btn primary mt-4">Try Again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
